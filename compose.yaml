services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_service_app
    restart: always
    command: npm start
    ports:
      - "${APP_PORT:-3630}:3630"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M # Batasi maksimal 512MB RAM
        reservations:
          memory: 256M # Alokasi awal 256MB RAM
    networks:
      - global-network-geosandbox

networks:
  global-network-geosandbox:
    name: global-network-geosandbox
    external: true
